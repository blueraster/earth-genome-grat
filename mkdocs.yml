site_name: grat
site_description: Groundwater Recharge Assessment Tool
repo_url: https://github.com/blueraster/earth-genome-grat
repo_name: blueraster/earth-genome-grat
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Guides:
      - Model: model.md
      - Reports: reports.md
  # The "API reference" section is generated from the docstrings in src/grat by mkdocs-api-autonav.

plugins:
  - search
  - api-autonav:
      modules: ["src/grat"]
      nav_section_title: API reference
      exclude: ["grat.datasets"]
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            # Many functions aren't type-annotated yet; don't fail --strict over that.
            docstring_options:
              warn_missing_types: false
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
